{% extends 'registrar/base.html' %}
{% block page_name %}Change Password{% endblock %}
{% block page_name_heading %}Change Password{% endblock %}

{% block content %}
<section class="page active">
<div class="panel" style="max-width:520px">
<div class="panel-head"><div><h3><i class="fa-solid fa-key"></i> Change Password</h3><span class="muted">Enter your current password, then choose a new one.</span></div></div>
<form method="post" autocomplete="off">{% csrf_token %}
<div class="form-grid" style="grid-template-columns:1fr">
  <div class="field"><label for="current_password">Current Password</label><input type="password" id="current_password" name="current_password" required autocomplete="current-password"></div>
  <div class="field"><label for="new_password">New Password</label><input type="password" id="new_password" name="new_password" required autocomplete="new-password"></div>
  <div class="field"><label for="confirm_password">Confirm New Password</label><input type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password"></div>
</div>
<div class="modal-actions"><button class="btn" type="submit"><i class="fa-solid fa-floppy-disk"></i> Update Password</button></div>
</form>
</div>
</section>
{% endblock %}
